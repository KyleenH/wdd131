<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Dynamic Web Fundamentals - Kyleen Hunter</title>
    <link rel="stylesheet" href="styles/form.css">
    <meta name="description" content="WDD 131 - Dynamic Web Fundamentals BYU Pathways- Kyleen Hunter - Product Review Form">
    <meta name="author" content="Kyleen Hunter">
    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/form.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <header>
              <h1>Product Review</h1>
        </header>
            <form method="get" action="review.html">
                <fieldset>
                    <legend>Product Name*</legend>
                    <select id="products" name="listed-products" required>
                        <label><option value="placeholder" disabled selected>Select a Product...</option></label>
                        <label><option value="flux">Flux Capacitor</option></label>
                        <label><option value="power">Power Laces</option></label>
                        <label><option value="time circuits">Time Circuits</option></label>
                        <label><opiton value="reactor">Low Voltage Reactor</opiton></label>
                        <label><option value="warp">Warp Equalizer</option></label>
                    </select>
                </fieldset>
                <fieldset>
                    <legend>Overall Rating*</legend>
                    <div class="stars">
                        <input type="radio" id="fivestar" name="stars" value="5" required><label for="fivestar"></label>
                        <input type="radio" id="fourstar" name="stars" value="4" required><label for="fourstar"></label>
                        <input type="radio" id="threestar" name="stars" value="3" required><label for="threestar"></label>
                        <input type="radio" id="twostar" name="stars" value="2" required><label for="twostar"></label>
                        <input type="radio" id="onestar" name="stars" value="1" required><label for="onestar"></label>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Date of Installation*</legend>
                    <label><input type="date" id="date" name="installation-date" required></label>
                </fieldset>
                <fieldset>
                    <label for="performance"> Which features did you find useful in the product?
                    (Check all that apply)</label>
                    <input type="checkbox" value="yes" id="duribility" name="product-duribility">Durability
                    <input type="checkbox" value="yes" id="ease" name="product-ease">Ease of Use
                    <input type="checkbox" value="yes" id="performance" name="product-performance">Performance
                    <input type="checkbox" value="yes" id="design" name="product-design">Design
                </fieldset>
                <fieldset>
                    <label for="review"> Written Review(Optional)</label>
                    <textarea id="review" name="written-review"></textarea>
                </fieldset>
                <fieldset>
                    <label>Your Name(Optional)</label>
                    <input type="text" name="users-name">
                </fieldset>
                <fieldset>
                    <label><input type="submit" value="submit"></label>
                </fieldset>
            </form>
    </main>
    <footer>
        <p><span id="currentyear"></span>&copy;2026 ✨ Kyleen Hunter ✨ Florida </p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>
    <script src="scripts/getdates.js" defer></script>
</body>
</html>
